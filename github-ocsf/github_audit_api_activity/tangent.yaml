runtime:
  plugins_path: "plugins/"
plugins:
  github_audit_api_activity:
    module_type: go
    path: .
    tests:
      - input: tests/input.json
        expected: tests/expected.json
sources:
  socket_main:
    type: socket
    socket_path: "/tmp/sidecar.sock"
sinks:
  blackhole:
    type: blackhole
dag:
  - from: socket_main
    to: [github_audit_api_activity]
  - from: github_audit_api_activity
    to: [blackhole]