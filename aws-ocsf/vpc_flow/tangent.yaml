runtime:
  plugins_path: "plugins/"
plugins:
  vpc_flow:
    module_type: go
    path: .
    tests:
      - input: tests/input.json
        expected: tests/expected.json
sources:
  socket_main:
    type: socket
    socket_path: "/tmp/sidecar.sock"
sinks:
  blackhole:
    type: blackhole
dag:
  - from: socket_main
    to: [vpc_flow]
  - from: vpc_flow
    to: [blackhole]