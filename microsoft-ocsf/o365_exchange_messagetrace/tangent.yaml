runtime:
  plugins_path: "plugins/"
plugins:
  o365_exchange_messagetrace:
    module_type: go
    path: .
    tests:
      - input: tests/input.json
        expected: tests/expected.json
sources:
  socket_main:
    type: socket
    socket_path: "/tmp/sidecar.sock"
sinks:
  blackhole:
    type: blackhole
dag:
  - from: socket_main
    to: [o365_exchange_messagetrace]
  - from: o365_exchange_messagetrace
    to: [blackhole]